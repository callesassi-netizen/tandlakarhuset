# Statisk sajt: inget bygge, hela mappen publiceras som den är.
[build]
  publish = "."
  command = ""

# Bilderna har versionerade filnamn (namn-bredd.webp) och kan cachas länge.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS och JS har inga versionerade filnamn, så en lång cache innebär att
# besökare sitter kvar på en gammal version tills den går ut. must-revalidate
# ger i stället en liten villkorlig förfrågan som svarar 304 när inget ändrats.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # TA BORT DEN HÄR RADEN VID SKARP LANSERING.
    # tandlakarhuset.blomstrande.net är en granskningsadress. Utan noindex
    # kan Google indexera den och låta den konkurrera med kundens riktiga sajt.
    X-Robots-Tag = "noindex, nofollow"

# Varje sida ska ha EN adress. .html-varianten pekar vidare med 301, så att
# gamla länkar och direktnavigering landar på den rena adressen.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/mottagningen.html"
  to = "/mottagningen"
  status = 301
  force = true

[[redirects]]
  from = "/tandvard.html"
  to = "/tandvard"
  status = 301
  force = true

[[redirects]]
  from = "/barn-och-ungdom.html"
  to = "/barn-och-ungdom"
  status = 301
  force = true

[[redirects]]
  from = "/tandhygienist.html"
  to = "/tandhygienist"
  status = 301
  force = true

[[redirects]]
  from = "/priser.html"
  to = "/priser"
  status = 301
  force = true

[[redirects]]
  from = "/kontakt.html"
  to = "/kontakt"
  status = 301
  force = true

# Den rena adressen serverar filen utan att adressfältet ändras
[[redirects]]
  from = "/mottagningen"
  to = "/mottagningen.html"
  status = 200

[[redirects]]
  from = "/tandvard"
  to = "/tandvard.html"
  status = 200

[[redirects]]
  from = "/barn-och-ungdom"
  to = "/barn-och-ungdom.html"
  status = 200

[[redirects]]
  from = "/tandhygienist"
  to = "/tandhygienist.html"
  status = 200

[[redirects]]
  from = "/priser"
  to = "/priser.html"
  status = 200

[[redirects]]
  from = "/kontakt"
  to = "/kontakt.html"
  status = 200
